<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablas de multiplicar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(160deg,#fff6d6,#d9f2ff);color:#1f2a44;min-height:100vh}
header{text-align:center;padding:14px 10px 4px}h1{margin:0;font-size:clamp(1.6rem,5vw,2.6rem);color:#e2572b}
main{max-width:760px;margin:0 auto;padding:10px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 14px #0002}
h2{margin:.2em 0 .5em;font-size:1.3rem}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tbtn,.btn,.key{font-size:1.3rem;font-weight:700;border:none;border-radius:14px;padding:12px;cursor:pointer;min-height:52px}
.tbtn{background:#eef1f6;color:#1f2a44}.tbtn[aria-pressed=true]{background:#2b8de2;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.btn{flex:1 1 150px;color:#fff}
.green{background:#22a35a}.orange{background:#f08a24}.purple{background:#7b4fd6}.gray{background:#6b7280}
button:focus-visible,input:focus-visible{outline:4px solid #ffbf00;outline-offset:2px}
.q{font-size:clamp(2.6rem,12vw,4.6rem);font-weight:800;text-align:center;margin:6px 0}
#ans{font-size:2.6rem;width:100%;text-align:center;border:3px solid #2b8de2;border-radius:14px;padding:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.key{background:#e8f3ff;font-size:1.8rem;min-height:64px}
.key.ok{background:#22a35a;color:#fff}.key.del{background:#ffd9cc}
.stats{display:flex;justify-content:space-around;font-size:1.15rem;font-weight:700;flex-wrap:wrap;gap:6px}
#fb{min-height:2.2em;text-align:center;font-size:1.5rem;font-weight:800;margin-top:8px}.good{color:#1a8a4a}.bad{color:#c7362b}
.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:1.6rem}td{padding:6px;text-align:center;border-bottom:1px solid #eee}
#timer{font-size:1.6rem;color:#c7362b}ul{font-size:1.4rem}
</style></head><body>
<header><h1>✖️ Tablas de multiplicar</h1><p>¡Hola, amiguito! Vamos a practicar.</p></header>
<main>
<section id="setup" class="card" aria-labelledby="h-el">
<h2 id="h-el">1. Elige las tablas</h2>
<div class="tables" id="tables" role="group" aria-label="Tablas"></div>
<div class="row"><button class="btn gray" id="all">Todas</button><button class="btn gray" id="none">Ninguna</button></div>
<h2 style="margin-top:16px">2. ¿Qué quieres hacer?</h2>
<div class="row"><button class="btn green" id="bPractice">🎯 Practicar</button><button class="btn orange" id="bChallenge">⏱️ Desafío 60 s</button><button class="btn purple" id="bStudy">📖 Ver tabla</button></div>
<p id="best" style="font-size:1.1rem;text-align:center"></p>
</section>
<section id="play" class="card hidden" aria-live="polite">
<div class="stats"><span>Puntos: <b id="score">0</b></span><span>Racha: <b id="streak">0</b> 🔥</span><span id="timerBox" class="hidden">⏱️ <b id="timer">60</b> s</span></div>
<div class="q" id="q">2 × 3 = ?</div>
<input id="ans" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Tu respuesta">
<div id="fb" role="status"></div>
<div class="pad" id="pad"></div>
<div class="row"><button class="btn gray" id="stop">Terminar</button></div>
</section>
<section id="study" class="card hidden"><h2>📖 Ver tabla</h2><div class="row" id="studyTabs"></div><table id="stTable"></table><div class="row"><button class="btn gray" id="back1">Volver</button></div></section>
<section id="summary" class="card hidden" aria-live="polite"><h2>🏁 Resumen</h2><div id="sumBody"></div><div class="row"><button class="btn green" id="again">Repasar errores</button><button class="btn gray" id="back2">Volver al inicio</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let sel=new Set([2,3,4,5]);
const praise=["¡Correcto! 🎉","¡Muy bien! ⭐","¡Excelente! 🚀","¡Eres un campeón! 🏆","¡Sigue así! 💪","¡Genial! 😄"];
let mode,score,streak,cur,missed,weights,tleft,tid,locked=false,answered;
function renderTables(){const t=$("tables");t.innerHTML="";for(let i=1;i<=12;i++){const b=document.createElement("button");b.className="tbtn";b.textContent=i;b.setAttribute("aria-pressed",sel.has(i));b.setAttribute("aria-label","Tabla del "+i);b.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);renderTables()};t.appendChild(b)}}
$("all").onclick=()=>{for(let i=1;i<=12;i++)sel.add(i);renderTables()};$("none").onclick=()=>{sel.clear();renderTables()};
function show(id){["setup","play","study","summary"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
function best(){const b=+localStorage.getItem("tablasBest")||0;$("best").textContent=b?"🏅 Tu mejor puntaje en el desafío: "+b:"";return b}
function need(){if(!sel.size){alert("Elige al menos una tabla.");return false}return true}
function key(a,b){return a+"×"+b}
function next(){const pool=[];[...sel].forEach(a=>{for(let b=1;b<=12;b++){const w=weights[key(a,b)]||1;for(let k=0;k<w;k++)pool.push([a,b])}});
let c;do{c=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&cur&&c[0]==cur[0]&&c[1]==cur[1]);cur=c;$("q").textContent=c[0]+" × "+c[1]+" = ?";$("ans").value="";locked=false;$("ans").focus()}
function start(m,onlyMissed){mode=m;score=0;streak=0;answered=0;cur=null;weights={};if(onlyMissed)missed.forEach(k=>weights[k]=4);missed=new Set(onlyMissed?[]:[]);
$("score").textContent=0;$("streak").textContent=0;$("fb").textContent="";$("timerBox").classList.toggle("hidden",m!=="challenge");show("play");
if(m==="challenge"){tleft=60;$("timer").textContent=60;tid=setInterval(()=>{tleft--;$("timer").textContent=tleft;if(tleft<=0)end()},1000)}next()}
function check(){if(locked)return;const v=$("ans").value.trim();if(v==="")return;const r=cur[0]*cur[1],k=key(cur[0],cur[1]);answered++;
if(+v===r){score++;streak++;weights[k]=Math.max(1,(weights[k]||1)-1);$("fb").className="good";$("fb").textContent=praise[Math.floor(Math.random()*praise.length)]+(streak>0&&streak%5==0?" ¡Racha de "+streak+"!":"");locked=true;setTimeout(next,mode==="challenge"?350:800)}
else{streak=0;missed.add(k);weights[k]=(weights[k]||1)+3;$("fb").className="bad";$("fb").textContent="¡Casi! "+cur[0]+" × "+cur[1]+" = "+r;locked=true;setTimeout(next,mode==="challenge"?1200:2000)}
$("score").textContent=score;$("streak").textContent=streak}
function end(){clearInterval(tid);let h="<p style='font-size:1.4rem'>Respuestas correctas: <b>"+score+"</b> de "+answered+".</p>";
if(mode==="challenge"){const b=best();if(score>b){localStorage.setItem("tablasBest",score);h+="<p style='font-size:1.4rem'>🏆 ¡Nuevo récord!</p>"}else h+="<p>Tu récord es "+b+". ¡Tú puedes superarlo!</p>"}
if(missed.size){h+="<p style='font-size:1.3rem'>Para repasar:</p><ul>"+[...missed].map(k=>{const[a,b]=k.split("×");return"<li>"+a+" × "+b+" = "+a*b+"</li>"}).join("")+"</ul>";$("again").classList.remove("hidden")}
else{h+="<p style='font-size:1.4rem'>¡No tuviste errores! 🌟</p>";$("again").classList.add("hidden")}$("sumBody").innerHTML=h;best();show("summary")}
const pad=$("pad");["1","2","3","4","5","6","7","8","9","⌫","0","✔"].forEach(c=>{const b=document.createElement("button");b.className="key"+(c=="✔"?" ok":c=="⌫"?" del":"");b.textContent=c;b.setAttribute("aria-label",c=="✔"?"Comprobar":c=="⌫"?"Borrar":c);
b.onclick=()=>{const a=$("ans");if(c=="✔")check();else if(c=="⌫")a.value=a.value.slice(0,-1);else if(a.value.length<3)a.value+=c};pad.appendChild(b)});
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
$("bPractice").onclick=()=>need()&&start("practice");$("bChallenge").onclick=()=>need()&&start("challenge");$("stop").onclick=end;
$("again").onclick=()=>{const m=new Set(missed);missed=m;start("practice",true);missed=new Set();Object.assign(weights,Object.fromEntries([...m].map(k=>[k,4])))};
function study(n){$("stTable").innerHTML=Array.from({length:12},(_,i)=>"<tr><td>"+n+" × "+(i+1)+"</td><td>=</td><td><b>"+n*(i+1)+"</b></td></tr>").join("");[...$("studyTabs").children].forEach(b=>b.setAttribute("aria-pressed",b.textContent==n))}
$("bStudy").onclick=()=>{if(!need())return;const s=$("studyTabs");s.innerHTML="";[...sel].sort((a,b)=>a-b).forEach(n=>{const b=document.createElement("button");b.className="tbtn";b.textContent=n;b.onclick=()=>study(n);s.appendChild(b)});study(Math.min(...sel));show("study")};
$("back1").onclick=$("back2").onclick=()=>show("setup");renderTables();best();
</script></body></html>
